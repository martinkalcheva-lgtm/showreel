  .status-indicator {

  .clear-button:hover { background: var(--color-surface-raised); border-color: var(--color-border-strong); }

  .controls { padding: 14px 24px 0; }

  .bot-line .mini-actions span { margin-left: 8px; color: var(--color-text-muted); font-size: 13px; }
  .typing { display: flex; align-items: center; gap: 9px; }
  .typing-bubble {

  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-accent); animation: blink 1.2s infinite; }

  .chat-footer input {

  /* ===== 右侧业务对象 ===== */
  .sidebar-card {
    position: relative;
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-lg);

  .biz-edge-btn {

    border: 1px solid var(--color-border); border-right: none;
    border-radius: 10px 0 0 10px;

    cursor: pointer;

  .biz-edge-btn:hover { background: var(--color-accent); color: #ffffff; border-color: var(--color-accent); }
  .biz-edge-btn svg { transition: transform 260ms ease; }
  .sidebar-card.collapsed .biz-edge-btn svg { transform: rotate(180deg); }

  /* ---------- 业务对象：收起态（贴右的窄竖条）---------- */
  .sidebar-card.collapsed { width: 58px; padding: 16px 8px; align-items: center; }

  .biz-collapsed-face { display: none; }
  .sidebar-card.collapsed .biz-collapsed-face {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; height: 100%;
    cursor: pointer; user-select: none;
  }
  .biz-vertical-text {
    writing-mode: vertical-rl; text-orientation: upright;
    letter-spacing: 4px; font-size: 13px; font-weight: 700; color: #12263f;
    white-space: nowrap;
  }
  .tabs { display: flex; gap: 10px; margin-bottom: 16px; }
  .tab {
    padding: 8px 24px; border-radius: 9999px; font-size: 14px; cursor: pointer;
    background: #f1f5fb; color: var(--color-text-secondary);
    border: 1px solid var(--color-border);
    transition: background 150ms ease, color 150ms ease;
  }
  .tab.active { background: var(--color-accent); color: #ffffff; font-weight: 700; border-color: var(--color-accent); }

  }
  .biz-img {

    font-size: 21px; font-weight: 700; margin-bottom: 12px;
  }
  .img-blue { background: linear-gradient(135deg, #3b6fd4, #1c3f8f); }
  .img-orange { background: linear-gradient(135deg, #f2a13c, #d97706); }
  .biz-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; color: #16233a; }
  .biz-sub { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 8px; }
  .biz-price { color: var(--color-warm); font-weight: 800; font-size: 15px; }
  .biz-tag {
    display: inline-block; font-size: 11px; color: var(--color-warm);
    background: rgba(180, 83, 9, .10); border-radius: 6px; padding: 2px 8px;
  }
  .biz-btn {
    width: 100%; margin-top: 12px; background: #ffffff;
    border: 1px solid var(--color-border); color: var(--color-text-secondary);
    border-radius: var(--radius-sm); padding: 10px; font-size: 13px; cursor: pointer;
    transition: background 150ms ease, border-color 150ms ease;
  }
  .biz-btn:hover { background: var(--color-accent-soft-bg); border-color: var(--color-accent); color: var(--color-accent); }

  /* ===================================================================
     数字人悬浮窗
     =================================================================== */
  .dh-widget {
    position: absolute;
    left: 24px; bottom: 96px;
    width: 176px; height: 292px;
    z-index: 60;
    display: flex; flex-direction: column;
    border-radius: var(--radius-md);
    background: #ffffff;
    border: 1px solid var(--color-border-strong);
    box-shadow: 0 12px 30px rgba(15, 42, 74, 0.14), 0 0 0 1px rgba(26, 86, 219, 0.05);
    overflow: hidden;
    transition: box-shadow 200ms ease;
  }
  .dh-widget:hover { box-shadow: 0 14px 34px rgba(15, 42, 74, 0.18), 0 0 0 2px rgba(26, 86, 219, 0.18); }
  .dh-widget.dragging { transition: none; cursor: grabbing; }

  .dh-widget-bar {
    height: 30px; flex-shrink: 0;
    display: flex; align-items: center; gap: 7px;
    padding: 0 8px 0 10px;
    background: linear-gradient(180deg, rgba(26, 86, 219, .10), rgba(26, 86, 219, .03));

  .dh-widget-title {

  .dh-grip {

    padding: 2px 4px; border-radius: 6px;
  }
  .dh-widget-bar:hover .dh-grip { background: rgba(26, 86, 219, .12); }

  .dh-widget-stage { position: relative; flex: 1; min-height: 0; }
  .dh-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    background: linear-gradient(180deg, #eef4ff, #dce7fa); overflow: hidden;

  .dh-overlay { position: absolute; inset: 0; z-index: 2; }
  .dh-placeholder {

  .dh-progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--color-accent), var(--color-info)); transition: width .3s; }
  .dh-spinner {

  }
  @keyframes dhSpin { to { transform: rotate(360deg) } }

  .dh-widget-foot {

    border-top: 1px solid var(--color-border-light);
    background: #f7f9fc;
  }
  .dh-button {
    width: 100%; border: 1px solid rgba(26, 86, 219, .35);
    background: var(--color-accent-soft); color: var(--color-accent);
    border-radius: 8px; padding: 7px 6px; font-size: 11px; font-weight: 600; cursor: pointer;
  }
  .dh-button:disabled { opacity: .6; cursor: not-allowed; }
  .dh-button-danger { border-color: rgba(220, 38, 38, .4); background: rgba(220, 38, 38, .08); color: var(--color-danger); }

  .dh-resize {
    position: absolute; right: 0; bottom: 0;

    background: linear-gradient(135deg, transparent 45%, rgba(26, 86, 219, .55) 45%, rgba(26, 86, 219, .55) 60%, transparent 60%,

    touch-action: none;
  }
  .dh-tip {
    position: absolute; z-index: 61; pointer-events: none;
    font-size: 11px; color: var(--color-accent); white-space: nowrap;
    background: #ffffff; border: 1px solid rgba(26, 86, 219, .30);
    box-shadow: 0 4px 12px rgba(15, 42, 74, .12);
    padding: 3px 10px; border-radius: 9999px;
  }

  /* ---------- ➖ 收起按钮 ---------- */
  .dh-collapse-btn {
    flex-shrink: 0; width: 18px; height: 18px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 50%; background: transparent;
    color: var(--color-text-secondary); font-size: 11px; line-height: 1;
    cursor: pointer; transition: background 150ms ease, color 150ms ease;
  }
  .dh-collapse-btn:hover { background: rgba(26, 86, 219, .14); color: var(--color-accent); }

  /* ---------- 收起态：缩成右侧一个小圆圈 ---------- */
  .dh-widget.dh-anim {
    transition: width 240ms cubic-bezier(.2,.8,.2,1),
                height 240ms cubic-bezier(.2,.8,.2,1),
                border-radius 240ms ease,
                box-shadow 200ms ease;
  }
  .dh-widget.collapsed { border-radius: 50%; }
  .dh-widget.collapsed .dh-widget-bar,
  .dh-widget.collapsed .dh-widget-stage,
  .dh-widget.collapsed .dh-widget-foot,
  .dh-widget.collapsed .dh-resize { display: none !important; }

  .dh-collapsed-face { display: none; }
  .dh-widget.collapsed .dh-collapsed-face {
    display: flex; position: relative;
    width: 100%; height: 100%; border-radius: 50%;
    align-items: center; justify-content: center;
    cursor: grab; touch-action: none;
    color: var(--color-accent);
    background: radial-gradient(circle at 38% 30%, #f4f8ff, #d7e4ff 74%);
    border: 1px solid rgba(26, 86, 219, .22);
  }
  .dh-widget.collapsed .dh-collapsed-face:active { cursor: grabbing; }
  .dh-collapsed-dot {
    position: absolute; right: 4px; bottom: 4px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--color-text-muted);
    border: 2px solid #ffffff;
  }
</style>

<script>
(function () {
  const card     = document.getElementById('chatCard');
  const widget   = document.getElementById('dhWidget');
  const handle   = document.getElementById('dhHandle');
  const resizeEl = document.getElementById('dhResize');
  const tip      = document.getElementById('dhTip');

  const collapseBtn   = document.getElementById('dhCollapse');
  const collapsedFace = document.getElementById('dhCollapsedFace');
  const collapsedDot  = document.getElementById('dhCollapsedDot');

  const sidebarCard      = document.getElementById('sidebarCard');
  const bizEdgeBtn       = document.getElementById('bizEdgeBtn');
  const bizCollapsedFace = document.getElementById('bizCollapsedFace');

  const MIN_W = 130, MIN_H = 210;
  const MAX_W = 340, MAX_H = 560;

  let rafId = null;
  function bump() {
    card.classList.add('boundary-hit');
    clearTimeout(rafId);
    rafId = setTimeout(() => card.classList.remove('boundary-hit'), 260);
  }

  function clampToCard(left, top) {
    const c = card.getBoundingClientRect();
    const w = widget.offsetWidth, h = widget.offsetHeight;
    const maxX = Math.max(6, c.width - w - 6);
    const maxY = Math.max(6, c.height - h - 6);
    const nx = Math.min(Math.max(left, 6), maxX);
    const ny = Math.min(Math.max(top, 6), maxY);
    if (nx !== left || ny !== top) bump();
    widget.style.left = nx + 'px';
    widget.style.top = ny + 'px';
    widget.style.bottom = 'auto';
    return [nx, ny];
  }

  /* ---------- 拖动：把手条 / 收起后的圆圈，都能拖 ---------- */
  let dragging = false, moved = false, startX = 0, startY = 0, originLeft = 0, originTop = 0;

  function dragStart(e, src) {
    dragging = true; moved = false;
    widget.classList.add('dragging');
    const r = widget.getBoundingClientRect();
    const c = card.getBoundingClientRect();
    originLeft = r.left - c.left;
    originTop  = r.top  - c.top;
    startX = e.clientX; startY = e.clientY;
    try { src.setPointerCapture(e.pointerId); } catch (_) {}
    tip.style.opacity = '0';
    e.preventDefault();
  }

  window.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
    clampToCard(originLeft + dx, originTop + dy);
  });
  window.addEventListener('pointerup', () => {
    if (!dragging) return;
    dragging = false;
    widget.classList.remove('dragging');
    applyLayout();
  });

  handle.addEventListener('pointerdown', (e) => dragStart(e, handle));
  collapsedFace.addEventListener('pointerdown', (e) => dragStart(e, collapsedFace));
  // 圆圈上「没拖动」的抬手 = 展开
  collapsedFace.addEventListener('pointerup', () => { if (!moved) expandWidget(); });

  /* ---------- 缩放：拖动右下角 ---------- */
  let resizing = false, rsX = 0, rsY = 0, rsW = 0, rsH = 0;
  resizeEl.addEventListener('pointerdown', (e) => {
    resizing = true;
    rsX = e.clientX; rsY = e.clientY;
    rsW = widget.offsetWidth; rsH = widget.offsetHeight;
    resizeEl.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  resizeEl.addEventListener('pointermove', (e) => {
    if (!resizing) return;
    const w = Math.min(Math.max(rsW + (e.clientX - rsX), MIN_W), MAX_W);
    const h = Math.min(Math.max(rsH + (e.clientY - rsY), MIN_H), MAX_H);
    widget.style.width = w + 'px';
    widget.style.height = h + 'px';
    clampToCard(parseFloat(widget.style.left) || 0, parseFloat(widget.style.top) || 0);
  });
  resizeEl.addEventListener('pointerup', (e) => {
    resizing = false;
    resizeEl.releasePointerCapture(e.pointerId);
    applyLayout();
  });

  /* ===================================================================
     ➖ 收起 / 展开：收起后变成卡片右侧的一个小圆圈
     =================================================================== */
  const CIRCLE = 56;      // 收起后的圆圈直径
  const RIGHT_GAP = 18;   // 距卡片右边距
  let saved = { left: 24, top: 120, width: 176, height: 292 };

  function collapseWidget() {
    if (widget.classList.contains('collapsed')) return;

    const r = widget.getBoundingClientRect();
    const c = card.getBoundingClientRect();
    saved.width  = widget.offsetWidth;
    saved.height = widget.offsetHeight;
    saved.left   = r.left - c.left;
    saved.top    = r.top  - c.top;

    widget.classList.add('dh-anim');
    void widget.offsetWidth;

    widget.classList.add('collapsed');
    widget.style.width  = CIRCLE + 'px';
    widget.style.height = CIRCLE + 'px';

    const nx = Math.max(6, card.clientWidth - CIRCLE - RIGHT_GAP);
    const ny = Math.min(Math.max(saved.top, 6), card.clientHeight - CIRCLE - 6);
    widget.style.left = nx + 'px';
    widget.style.top  = ny + 'px';
    widget.style.bottom = 'auto';

    setTimeout(() => widget.classList.remove('dh-anim'), 320);
  }

  function expandWidget() {
    if (!widget.classList.contains('collapsed')) return;

    widget.classList.add('dh-anim');
    void widget.offsetWidth;

    widget.classList.remove('collapsed');
    widget.style.width  = saved.width + 'px';
    widget.style.height = saved.height + 'px';
    clampToCard(saved.left, saved.top);

    requestAnimationFrame(() => requestAnimationFrame(() => applyLayout()));
    setTimeout(() => { applyLayout(); widget.classList.remove('dh-anim'); }, 320);
  }

  // 收起按钮在把手条里，别让它触发拖动
  collapseBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
  collapseBtn.addEventListener('click', (e) => { e.stopPropagation(); collapseWidget(); });

  /* ===================================================================
     业务对象面板：左边中间的箭头按钮 → 收起成贴右的窄竖条
     =================================================================== */
  let bizTimer = null;

  // 面板宽度变了 → 聊天卡片跟着变宽/变窄，数字人要重新夹边 + 重排
  function reflowAfterSidebar() {
    clearTimeout(bizTimer);
    bizTimer = setTimeout(() => {
      clampToCard(parseFloat(widget.style.left) || 0, parseFloat(widget.style.top) || 0);
      applyLayout();
    }, 320);
  }

  bizEdgeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const collapsed = sidebarCard.classList.toggle('collapsed');
    bizEdgeBtn.title = collapsed ? '展开业务对象' : '收起业务对象';
    reflowAfterSidebar();
  });

  bizCollapsedFace.addEventListener('click', () => {
    sidebarCard.classList.remove('collapsed');
    bizEdgeBtn.title = '收起业务对象';
    reflowAfterSidebar();
  });

  window.addEventListener('resize', () => {
    clampToCard(parseFloat(widget.style.left) || 0, parseFloat(widget.style.top) || 0);
    applyLayout();
  });

  /* ===================================================================
     数字人真实接入逻辑（与项目 App.vue 一致）
     =================================================================== */
  const dot = document.getElementById('dhDot');
  const title = document.getElementById('dhTitle');
  const btn = document.getElementById('dhToggle');
  const pIdle = document.getElementById('dhPIdle');
  const pLoading = document.getElementById('dhPLoading');
  const pError = document.getElementById('dhPError');
  const progressBar = document.getElementById('dhProgressBar');
  const progressText = document.getElementById('dhProgressText');
  const errorText = document.getElementById('dhErrorText');

  const DH_STATUS_TEXT = {
    idle: '数字人 · 未连接',
    loading: '数字人 · 加载中',
    ready: '数字人 · 已连接',
    error: '数字人 · 连接失败',
  };

  let status = 'idle';
  let liteSDK = null;

  function setStatus(next, msg) {
    status = next;
    const dotState = { ready: 'dh-dot-ready', loading: 'dh-dot-loading', error: 'dh-dot-error' }[next] || '';
    dot.className = 'dh-status-dot ' + dotState;
    collapsedDot.className = 'dh-collapsed-dot ' + dotState;
    title.textContent = DH_STATUS_TEXT[next];
    pIdle.hidden = next !== 'idle';
    pLoading.hidden = next !== 'loading';
    pError.hidden = next !== 'error';
    if (msg) errorText.textContent = msg;
    btn.disabled = next === 'loading';
    btn.classList.toggle('dh-button-danger', next === 'ready');
    btn.textContent = next === 'loading' ? '连接中…'
                    : next === 'ready'   ? '断开连接'
                    : next === 'error'   ? '重试连接' : '连接数字人';
  }

  function applyLayout() {
    if (!liteSDK) return;
    try {
      liteSDK.changeLayout({
        container: { size: [widget.querySelector('.dh-widget-stage').clientWidth,
                            widget.querySelector('.dh-widget-stage').clientHeight] },
        avatar: { v_align: 'bottom', h_align: 'center', scale: '95vh', offset_x: 0, offset_y: 0 },
      });
    } catch (e) { console.warn('[数字人] 布局适配失败:', e); }
  }

  async function connect() {
    if (status === 'loading' || status === 'ready') return;
    setStatus('loading');
    progressBar.style.width = '0%';
    progressText.textContent = '0% · 正在获取数字人凭证…';

    const CRED_URLS = [
      '/api/digital-human/credentials',
      'http://127.0.0.1:18777/api/digital-human/credentials',
      'http://127.0.0.1:5173/api/digital-human/credentials',
      'http://127.0.0.1:18082/api/digital-human/credentials',
    ];
    const CRED_LABELS = ['同源/api', '本地代理18777', 'vite代理5173', '后端直连18082'];

    let cred;
    try {
      const attempts = [];
      for (let i = 0; i < CRED_URLS.length; i++) {
        progressText.textContent = '正在获取数字人凭证…（' + CRED_LABELS[i] + '）';
        try {
          const resp = await fetch(CRED_URLS[i]);
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          cred = await resp.json();
          break;
        } catch (e) {
          attempts.push(CRED_LABELS[i] + ':' + e.message);
          console.warn('[数字人] 凭证获取失败 -', CRED_LABELS[i], e);
        }
      }
      if (!cred) {
        setStatus('error',
          '四个入口都取不到凭证。页面Origin=' + location.origin + '。' +
          '明细：' + attempts.join('；')
        );
        return;
      }
    } catch (e) {
      setStatus('error', '获取数字人凭证异常：' + e.message);
      return;
    }
    if (!cred || !cred.app_id || !cred.app_secret) {
      setStatus('error', '后端未配置数字人凭证，请检查 .env。');
      return;
    }
    if (typeof XmovAvatar !== 'function') {
      setStatus('error', 'SDK 未加载（预览页可能无法访问 CDN）。');
      return;
    }

    try {
      liteSDK = new XmovAvatar({
        containerId: '#digital-human-sdk',
        appId: cred.app_id,
        appSecret: cred.app_secret,
        gatewayServer: cred.gateway_server,
        hardwareAcceleration: 'prefer-hardware',
        enableLogger: true,
        onMessage(m) {
          if (m && m.code && m.code !== 50001 && m.code !== 50002) {
            setStatus('error', '数字人错误 code=' + m.code + ' ' + (m.message || ''));
          }
        },
        onStateChange(s) {
          if (s === 'speak') progressText.textContent = '数字人正在朗读…';
          else if (s === 'interactive_idle') progressText.textContent = '已就绪，等待提问';
        },
      });

      await liteSDK.init({
        initModel: 'normal',
        onDownloadProgress(p) {
          const v = Math.max(0, Math.min(100, Math.round(p)));
          progressBar.style.width = v + '%';
          progressText.textContent = v + '% · ' + (v < 100 ? '正在下载 3D 模型与表情资源…' : '资源就绪');
        },
      });

      setStatus('ready');
      requestAnimationFrame(applyLayout);
    } catch (e) {
      const detail = (e && e.message) || String(e);
      setStatus('error', '数字人初始化失败：' + detail);
      try { await liteSDK?.destroy(); } catch (_) {}
      liteSDK = null;
    }
  }

  async function disconnect() {
    const inst = liteSDK;
    liteSDK = null;
    setStatus('idle');
    progressBar.style.width = '0%';
    try { await inst?.destroy(); } catch (_) {}
  }

  btn.addEventListener('click', () => (status === 'ready' ? disconnect() : connect()));

  /* ===================================================================
     聊天发送：接真实后端（三路降级）+ 数字人朗读
     =================================================================== */
  const CHAT_URLS = [
    '/api/chat',
    'http://127.0.0.1:18777/api/chat',
    'http://127.0.0.1:5173/api/chat',
  ];
  const CHAT_LABELS = ['同源/api', '本地代理18777', 'vite代理5173'];

  const senderIdInput = document.getElementById('senderIdInput');
  const draftInput = document.getElementById('draftInput');
  const sendBtn = document.getElementById('sendBtn');
  const messagesArea = document.getElementById('messagesArea');
  const typingRow = document.getElementById('typingRow');
  const errorLine = document.getElementById('errorLine');
  let sending = false;

  function refreshSendBtn() {
    sendBtn.disabled = sending || !draftInput.value.trim();
    sendBtn.textContent = sending ? '发送中...' : '发送';
  }
  draftInput.addEventListener('input', refreshSendBtn);
  refreshSendBtn();

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function appendUserTurn(text) {
    const el = document.createElement('div');
    el.className = 'turn-card is-new';
    el.innerHTML =
      '<div class="turn-header"><span class="turn-badge">Turn —</span><span class="turn-label">对话轮次</span></div>' +
      '<div class="section-header"><div class="avatar-wrapper"></div>' +
      '<div><span class="agent-name">你</span><span class="agent-label">用户</span></div></div>' +
      '<div class="turn-bubble">' + esc(text) + '</div>';
    messagesArea.appendChild(el);
  }

  function appendBotTurn(text) {
    const el = document.createElement('div');
    el.className = 'bot-line is-new';
    el.innerHTML = '<span>' + esc(text) + '</span>' +
      '<span class="mini-actions"><span>🔊</span><span>📋</span></span>';
    messagesArea.appendChild(el);
  }

  function scrollBottom() { messagesArea.scrollTop = messagesArea.scrollHeight; }

  async function doSend() {
    if (sending) return;
    const text = draftInput.value.trim();
    const sid = senderIdInput.value.trim();
    if (!sid) { errorLine.hidden = false; errorLine.textContent = '请先输入 sender_id。'; return; }
    if (!text) return;

    draftInput.value = '';
    sending = true;
    refreshSendBtn();
    errorLine.hidden = true;
    appendUserTurn(text);
    typingRow.hidden = false;
    scrollBottom();

    try {
      const attempts = [];
      let data = null;
      for (let i = 0; i < CHAT_URLS.length; i++) {
        try {
          const resp = await fetch(CHAT_URLS[i], {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sender_id: sid, text: text }),
          });
          const body = await resp.json().catch(() => null);
          if (!resp.ok) throw new Error((body && body.detail) || ('HTTP ' + resp.status));
          data = body;
          break;
        } catch (e) {
          attempts.push(CHAT_LABELS[i] + ':' + e.message);
        }
      }
      if (!data) throw new Error(attempts.join('；'));

      const msgs = data.messages || [];
      if (!msgs.length) appendBotTurn('（后端返回了空消息）');
      msgs.forEach((m) => {
        if (m.text) appendBotTurn(m.text);
        else if (m.object) appendBotTurn('（业务对象：' + (m.object.title || m.object.type) + '）');
      });

      const speakText = msgs.map((m) => m.text).filter(Boolean).join(' ');
      if (speakText && liteSDK) {
        try { liteSDK.speak(speakText, true, true); } catch (e) { console.warn('[数字人] 朗读失败:', e); }
      }
    } catch (e) {
      errorLine.hidden = false;
      errorLine.textContent = '发送失败：' + e.message + '（页面Origin=' + location.origin + '）';
    } finally {
      sending = false;
      typingRow.hidden = true;
      refreshSendBtn();
      scrollBottom();
    }
  }

  sendBtn.addEventListener('click', doSend);
  document.getElementById('composer').addEventListener('submit', (e) => { e.preventDefault(); doSend(); });
  draftInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); doSend(); }
  });

  window.addEventListener('load', () => {
    clampToCard(24, card.getBoundingClientRect().height - widget.offsetHeight - 96);
    setStatus('idle');
    const t = tip;
    t.style.left = (widget.offsetLeft + widget.offsetWidth / 2) + 'px';
    t.style.top = (widget.offsetTop - 20) + 'px';
    t.style.transform = 'translateX(-50%)';
    setTimeout(() => { t.style.transition = 'opacity .4s'; t.style.opacity = '0'; }, 4200);
  });
})();
</script>
</body>
</html>
