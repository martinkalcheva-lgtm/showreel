<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>郭怡彤 · 在线演示入口</title>
<style>
  :root {
    --bg: #f2f3f5; --card: #ffffff; --text: #1c1c1e; --sub: #8e8e93;
    --accent: #007aff; --accent2: #34c759; --warn: #ff9f0a;
    --shadow: 0 8px 30px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --card:#1c1c1e; --text:#f2f2f7; --sub:#98989f;
            --shadow:0 8px 30px rgba(0,0,0,.5); }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
         display:flex; justify-content:center; padding:28px 16px; }
  .wrap { width:100%; max-width:560px; }
  header { text-align:center; margin-bottom:24px; }
  header h1 { font-size:26px; font-weight:700; margin:0 0 6px; letter-spacing:-.3px; }
  header p { color:var(--sub); font-size:14px; margin:0; }
  .card { background:var(--card); border-radius:18px; padding:18px 20px; margin-bottom:14px;
          box-shadow:var(--shadow); display:flex; align-items:center; gap:14px; text-decoration:none; color:inherit; }
  .icon { width:46px; height:46px; border-radius:13px; flex:none;
          display:flex; align-items:center; justify-content:center; font-size:22px; }
  .meta { flex:1; min-width:0; }
  .meta h3 { font-size:17px; font-weight:600; margin:0 0 3px; }
  .meta .desc { font-size:13px; color:var(--sub); margin:0;
               overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta .stat { font-size:11px; margin-top:5px; display:inline-block;
                padding:2px 8px; border-radius:20px; background:rgba(52,199,89,.15); color:var(--accent2); }
  .meta .stat.off { background:rgba(255,159,10,.15); color:var(--warn); }
  .open { flex:none; background:var(--accent); color:#fff;
          padding:10px 16px; border-radius:12px; font-size:14px; font-weight:600;
          transition:transform .08s ease; }
  .card:active .open { transform:scale(.95); }
  .open.disabled { background:#c7c7cc; }
  .tip { text-align:center; color:var(--sub); font-size:12px; margin-top:18px; line-height:1.6; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>在线演示入口</h1>
      <p>点击任意项目，即跳转至在线演示</p>
    </header>

    <a class="card" href="http://62.234.56.90:8088/login" target="_blank" rel="noopener">
      <div class="icon" style="background:rgba(0,122,255,.15)">🧠</div>
      <div class="meta">
        <h3>Octop 知识库</h3>
        <p class="desc">本地知识库 · 智能问答</p>
        <span class="stat">● 云端常驻</span>
      </div>
      <span class="open">打开</span>
    </a>

    <a class="card" href="http://62.234.56.90:5173/" target="_blank" rel="noopener">
      <div class="icon" style="background:rgba(52,199,89,.15)">📊</div>
      <div class="meta">
        <h3>Boss 工作台 / 问数</h3>
        <p class="desc">数据看板 · 问数智能体</p>
        <span class="stat">● 需主机在线</span>
      </div>
      <span class="open">打开</span>
    </a>

    <a class="card" href="http://62.234.56.90:18082/" target="_blank" rel="noopener">
      <div class="icon" style="background:rgba(255,149,0,.15)">💬</div>
      <div class="meta">
        <h3>智能应答台</h3>
        <p class="desc">客服应答 · 自动回复</p>
        <span class="stat">● 需主机在线</span>
      </div>
      <span class="open">打开</span>
    </a>

    <a class="card" href="http://62.234.56.90:3000/" target="_blank" rel="noopener">
      <div class="icon" style="background:rgba(175,82,222,.15)">🛒</div>
      <div class="meta">
        <h3>运营智能体</h3>
        <p class="desc">电商运营 · 经营助手</p>
        <span class="stat">● 需主机在线</span>
      </div>
      <span class="open">打开</span>
    </a>

    <a class="card" href="http://62.234.56.90:7954/chat.html" target="_blank" rel="noopener">
      <div class="icon" style="background:rgba(255,59,48,.15)">📚</div>
      <div class="meta">
        <h3>智库问答</h3>
        <p class="desc">知识库问答（暂未上线）</p>
        <span class="stat off">○ 暂未上线</span>
      </div>
      <span class="open disabled">未上线</span>
    </a>

    <p class="tip">
      演示需主机 / 云服务器在线时方可访问。<br/>
      微信内点击若被拦截，请点右上角「··· → 在浏览器打开」。
    </p>
  </div>
</body>
</html>
