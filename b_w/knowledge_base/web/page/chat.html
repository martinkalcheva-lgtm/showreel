<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" class="js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BOSS智库知识库</title>
  <link rel="stylesheet" href="design-system.css">
  <style>
    /* ==========================================================================
       页面级布局规则（kb-chat 落地）
       硬约束：只消费 design-system.css 的 token 与组件类。
       本文件不新增任何颜色 / 圆角 / 阴影 / 字体族。
       .avatar / .bubble / .meta / details.progress / .typing / .dot /
       .answer-images 是页面脚本逐字保留的旧模板类名（SSE 逻辑一行不改），
       这里用 token 把它们桥接到设计系统外观。
       ========================================================================== */
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    /* 应用外壳：100vh 骨架，#chat 作为内部滚动容器（scrollToBottom 依赖它） */
    .app { height: 100vh; }
    .app-body { min-height: 0; }
    .rail { overflow-y: auto; }
    .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

    /* 顶栏 */
    .app-top .brand .mark { font-size: 1.15rem; }
    .app-top .brand h1 { font: inherit; letter-spacing: inherit; text-wrap: wrap; }
    .top-actions {
      display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
      justify-content: flex-end;
    }

    /* 左栏 */
    .rail .panel-head h2 { font-size: var(--fs-meta); }
    .rail-hint { font-size: var(--fs-mini); color: var(--muted); line-height: 1.75; }
    .opt-row {
      display: flex; align-items: center; gap: .5rem; min-height: 44px;
      font-size: var(--fs-meta); color: var(--fg-secondary); cursor: pointer;
    }
    .opt-row input { width: 15px; height: 15px; accent-color: var(--accent); flex: none; }

    /* 主区 */
    .pane-inner {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      width: 100%; min-width: 0; max-width: 58rem; margin-inline: auto;
    }
    .stream {
      flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
      display: grid; gap: var(--sp-5); align-content: start; padding: 2px;
    }

    /* 消息桥接（脚本模板类名 → 设计系统外观） */
    .msg { grid-template-columns: auto minmax(0, 1fr); }
    .avatar {
      min-width: 28px; height: 28px; padding: 0 .5rem;
      border-radius: var(--radius);
      display: grid; place-items: center;
      font-family: var(--font-mono); font-size: var(--fs-mini); font-weight: 700;
      white-space: nowrap; overflow: hidden;
    }
    .avatar.bot { background: var(--fg); color: var(--bg); }
    .msg.user { grid-template-columns: minmax(0, 1fr) auto; }
    .msg.user > div:not(.avatar) {
      display: flex; flex-direction: column; align-items: flex-end;
      min-width: 0; max-width: 40rem;
    }
    .msg.bot > div:not(.avatar) { min-width: 0; }
    .bubble {
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface);
      padding: .75rem 1rem;
      line-height: 1.85; font-size: var(--fs-body); color: var(--fg);
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .msg.user .bubble { background: var(--surface-subtle); }
    .meta {
      font-family: var(--font-mono); font-size: var(--fs-mini);
      color: var(--faint); margin-top: .375rem;
    }

    /* 阶段进度（桥接自旧 details.progress，形态对齐设计稿 .trace） */
    details.progress {
      margin-top: var(--sp-2);
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface-subtle);
      padding: .5rem .75rem;
    }
    details.progress summary {
      cursor: pointer; user-select: none;
      font-family: var(--font-mono); font-size: var(--fs-mini); color: var(--muted);
    }
    details.progress ul { margin: .5rem 0 0 1.25rem; padding: 0; }
    details.progress li {
      margin: .25rem 0; font-size: var(--fs-mini); line-height: 1.7;
      color: var(--fg-secondary); overflow-wrap: anywhere;
    }

    /* 等待态：三点指示（状态指示类无限动画，属允许预算） */
    .typing { display: inline-flex; gap: 6px; align-items: center; margin-bottom: .5rem; }
    .dot {
      width: 7px; height: 7px; border-radius: var(--radius);
      background: var(--faint); flex: none;
      animation: dot-pulse 1.2s var(--ease-loop) infinite;
    }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes dot-pulse {
      0%, 80%, 100% { transform: translateY(0); opacity: .6; }
      40% { transform: translateY(-4px); opacity: 1; }
    }

    /* 答案图片 */
    .answer-images { margin-top: var(--sp-3); display: flex; flex-direction: column; gap: var(--sp-3); }
    .answer-images img {
      display: block; max-width: min(100%, 600px); max-height: 600px;
      width: auto; height: auto;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface);
    }
    .answer-images a {
      font-family: var(--font-mono); font-size: var(--fs-mini);
      color: var(--muted); text-decoration: none; word-break: break-all;
    }

    /* Composer */
    .composer-wrap {
      position: sticky; bottom: 0; z-index: 20;
      margin-top: var(--sp-3); padding-top: var(--sp-3);
      background: var(--bg); border-top: 1px solid var(--border);
    }
    .composer-actions { display: flex; align-items: center; gap: .5rem; }
    .composer-foot {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: .25rem var(--sp-3);
      margin-top: .5rem; padding-bottom: var(--sp-3);
      font-family: var(--font-mono); font-size: var(--fs-mini); color: var(--faint);
    }

    /* ==========================================================================
       响应式
       ========================================================================== */
    @media (max-width: 899px) {
      .stream { gap: var(--sp-4); }
      .msg.user > div:not(.avatar) { max-width: none; }
    }
    @media (max-width: 767px) {
      .top-actions { width: 100%; justify-content: flex-start; }
      .bubble { padding: .625rem .75rem; }
    }
    @media (max-width: 640px) {
      .composer { grid-template-columns: minmax(0, 1fr); }
      .composer-actions { justify-content: flex-end; }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- ============================ 顶栏 ============================ -->
  <header class="app-top">
    <div class="brand">
      <svg class="mark ic-lg" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <rect x="12" y="12" width="8" height="8" rx="2"/>
        <rect x="4" y="4" width="4" height="4" rx="1"/>
        <rect x="24" y="4" width="4" height="4" rx="1"/>
        <rect x="4" y="24" width="4" height="4" rx="1"/>
        <rect x="24" y="24" width="4" height="4" rx="1"/>
      </svg>
      <h1>BOSS智库知识库</h1>
      <span class="sub">KB AGENT · RAG</span>
    </div>

    <div class="top-actions">
      <span class="badge mono" id="apiPill">API: 未连接</span>
      <a class="btn btn-sm" href="import.html">
        <svg class="ic ic-sm" aria-hidden="true" focusable="false"><use href="#i-doc"></use></svg>
        <span>文件导入</span>
      </a>
      <button type="button" class="btn btn-sm btn-ghost" id="btnClear">清空对话</button>
      <button type="button" class="btn btn-ghost" id="themeBtn" aria-label="切换明暗主题">
        <span id="themeLabel">DARK</span>
      </button>
    </div>
  </header>

  <div class="app-body has-rail">

    <!-- ============================ 左栏 ============================ -->
    <aside class="rail" aria-label="会话设置">
      <div class="panel">
        <div class="panel-head">
          <h2>输出设置</h2>
        </div>
        <div class="panel-body">
          <label class="opt-row" for="streamToggle">
            <input type="checkbox" id="streamToggle" checked>
            <span>流式输出</span>
          </label>
          <p class="rail-hint">开启后答案逐段推送、阶段进度实时更新；关闭后一次性返回完整答案。</p>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>使用提示</h2>
        </div>
        <div class="panel-body">
          <p class="rail-hint">先在「文件导入」上传资料，再回到本页提问。回答展开「阶段进度」可查看服务端处理链路；答案中的图片会随文附上原链接。</p>
        </div>
      </div>
    </aside>

    <!-- ============================ 主区 ============================ -->
    <main class="pane">
      <div class="pane-inner">
        <div class="stream" id="chat">
          <article class="msg bot">
            <div class="avatar bot" aria-hidden="true">KB</div>
            <div>
              <div class="bubble">你好，我是BOSS智库知识库客服。你可以直接提问，我会在“阶段进度”里展示处理过程。</div>
              <p class="meta">提示：可以问“如何使用万用表测量电压？”</p>
            </div>
          </article>
        </div>

        <!-- ---------- Composer ---------- -->
        <div class="composer-wrap">
          <div class="composer">
            <label class="sr-only" for="input">向知识库提问</label>
            <textarea id="input" rows="2" placeholder="请输入问题（Enter 发送，Shift+Enter 换行）"></textarea>
            <div class="composer-actions">
              <button type="button" class="btn btn-primary" id="send">
                发送<svg class="ic ic-sm" aria-hidden="true" focusable="false"><use href="#i-arrow-r"></use></svg>
              </button>
            </div>
          </div>
          <div class="composer-foot">
            <span>Enter 发送 · Shift + Enter 换行</span>
            <span>答案附阶段进度与来源图片</span>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="icons.js" defer></script>
<script>
  (function () {
    function sync() {
      var el = document.getElementById('themeLabel');
      if (!el) return;
      el.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? 'LIGHT' : 'DARK';
    }
    document.addEventListener('click', function (e) {
      if (e.target && e.target.closest && e.target.closest('#themeBtn')) setTimeout(sync, 0);
    });
    sync();
  })();
</script>
<script>
    // 默认同源；如你把页面单独打开（file://），可改成 http://127.0.0.1:8001
    const API_BASE = `${location.protocol}//${location.host}`.includes('http') ? `${location.protocol}//${location.host}` : 'http://127.0.0.1:8001';
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const apiPill = document.getElementById('apiPill');
    const btnClear = document.getElementById('btnClear');
    const streamToggle = document.getElementById('streamToggle');

    // Session ID Logic
    let sessionId = localStorage.getItem('kb_session_id');
    if (!sessionId) {
      sessionId = 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('kb_session_id', sessionId);
    }

    function scrollToBottom(){
      chatEl.scrollTop = chatEl.scrollHeight;
    }
    function nowTime(){
      const d = new Date();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function formatTime(ts){
      if(!ts) return nowTime();
      const d = new Date(Number(ts) * 1000);
      if(Number.isNaN(d.getTime())) return nowTime();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    function isImageUrl(url){
      // 增加宽松度，有些 url 可能后面跟了奇怪的参数
      // 只要包含 .jpg .png 等扩展名，且后面是 ? # 或 结束，或者被某些标点截断前
      // 简单判断：路径部分以图片后缀结尾
      try {
        const u = new URL(url);
        return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(u.pathname);
      } catch (e) {
        // 如果 new URL 失败（比如相对路径或非法字符），退回正则匹配
        return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || '');
      }
    }

    function normalizeUrl(rawUrl){
      const s = String(rawUrl || '').trim();
      if(!s) return '';
      // 尽量保留原始 URL，但把空格编码，避免 img src 失败
      return s.replace(/\s/g, '%20');
    }

    function dedupeKeepOrder(arr){
      const seen = new Set();
      const out = [];
      for(const x of (Array.isArray(arr) ? arr : [])){
        const v = String(x || '');
        if(!v) continue;
        if(seen.has(v)) continue;
        seen.add(v);
        out.push(v);
      }
      return out;
    }

    function extractUrlsLoose(text){
      const s = String(text || '');
      // 简单正则提取：匹配 http/https 开头，直到遇到空白字符
      // [^\s] 包含中文、特殊符号等，直到遇到换行或空格
      const regex = /(https?:\/\/[^\s]+)/g;
      const matches = s.match(regex) || [];
      const urls = [];

      // 去除首尾标点
      const trimTailPunct = (u) => String(u || '').replace(/[)\]}'">，。,;；\]】）＞]+$/g, '');
      const trimHeadPunct = (u) => String(u || '').replace(/^[<([{'"]+|^[＜（【\[]+/g, '');

      for(const m of matches){
        let u = trimHeadPunct(trimTailPunct(m));
        // 简单清洗可能混入的结尾
        if(u) urls.push(u);
      }
      return dedupeKeepOrder(urls);
    }

    function parseImagesFromTextLoosely(text){
      const urls = extractUrlsLoose(text).filter(isImageUrl);
      return dedupeKeepOrder(urls);
    }

    function findLastImageMarkerIndex(raw){
      const s = String(raw || '');
      // 支持多种写法：【图片】、【 图片 】、[图片]、[ 图片 ]
      const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
      let m;
      let lastIdx = -1;
      let lastLen = 0;
      while((m = re.exec(s)) !== null){
        lastIdx = m.index;
        lastLen = m[0].length;
      }
      return { idx: lastIdx, len: lastLen };
    }

    function parseAnswerAndImages(text){
      const raw = String(text || '');
      const { idx, len } = findLastImageMarkerIndex(raw);
      if(idx === -1) return { text: raw, images: [] };

      const before = raw.slice(0, idx).trimEnd();
      const after = raw.slice(idx + len).trim();
      const urls = [];

      // 优先按“每行一个 URL”的方式解析，允许 URL 中包含空格
      const lines = after.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      for(const line of lines){
        if(line.startsWith('http://') || line.startsWith('https://')){
          urls.push(line);
        }else{
          // 兼容同一行包含多个 URL 的情况
          const matches = extractUrlsLoose(line);
          for(const u of matches){
            urls.push(u);
          }
        }
      }

      // 去重保序 + 过滤图片链接
      const seen = new Set();
      const images = [];
      for(const u of urls){
        const normalized = normalizeUrl(u);
        if(!isImageUrl(normalized)) continue;
        if(seen.has(normalized)) continue;
        seen.add(normalized);
        images.push(normalized);
      }
      return { text: before, images };
    }

    function shouldShowImagesByAnswer(answerText){
      const t = String(answerText || '');
      // 常见“需要看图/见图/如下图”的表述
      const keywords = [
        '如图', '如下图', '见图', '见下图', '下图', '上图',
        '图片', '示意图', '结构图', '外观', '接线图', '电路图', '原理图', '安装图', '尺寸图', '截图'
      ];
      return keywords.some(k => t.includes(k));
    }

    function renderAnswerWithImages(containerEl, answerText, candidateImageUrls){
      const { text, images: imagesFromBlock } = parseAnswerAndImages(answerText);
      const candidates = Array.isArray(candidateImageUrls)
        ? candidateImageUrls.map(normalizeUrl).filter(isImageUrl)
        : [];
      const hasBlockImages = imagesFromBlock && imagesFromBlock.length > 0;

      // 使用宽松提取
      const looseImages = extractUrlsLoose(answerText).map(normalizeUrl).filter(isImageUrl);

      // 只要后端给了候选图片，就展示（避免答案没写“如图”但用户仍需要看图）
      // 或者从文本里提取到了图片 URL
      const shouldShow = hasBlockImages || (candidates.length > 0) || (looseImages.length > 0);

      // 优先级：Block 显式标记 > 后端候选 > 文本宽松提取
      // 注意：这里做个并集可能更好，防止漏掉
      const allImages = new Set([
          ...(hasBlockImages ? imagesFromBlock : []),
          ...candidates,
          ...looseImages
      ]);
      const images = Array.from(allImages);

      containerEl.textContent = '';

      if((text || '').trim().length > 0){
        const textEl = document.createElement('div');
        textEl.className = 'answer-text';
        textEl.textContent = text;
        containerEl.appendChild(textEl);
      }else{
        const textEl = document.createElement('div');
        textEl.className = 'answer-text';
        textEl.textContent = '（已完成，但未返回答案）';
        containerEl.appendChild(textEl);
      }

      if(images && images.length > 0){
        const imgWrap = document.createElement('div');
        imgWrap.className = 'answer-images';
        for(const url of images){
          const safeUrl = normalizeUrl(url);
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.src = safeUrl;
          img.alt = '参考图片';
          img.referrerPolicy = 'no-referrer';
          img.addEventListener('error', () => {
            img.style.display = 'none';
          });
          imgWrap.appendChild(img);

          const link = document.createElement('a');
          link.href = safeUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = url;
          imgWrap.appendChild(link);
        }
        containerEl.appendChild(imgWrap);
      }
    }

    function addUserMsg(text){
      const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${nowTime()}</div>
          </div>
          <div class="avatar">我</div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }

    function addUserMsgWithTime(text, ts){
      const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
          <div class="avatar">我</div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }

    function addBotMsgWithTime(text, ts, imageUrls){
      const id = 'bot-his-' + Math.random().toString(36).slice(2);
      const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">BOSS智库</div>
          <div>
            <div class="bubble"><div class="answer"></div></div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      const el = document.getElementById(id);
      if(el){
        const answerEl = el.querySelector('.answer');
        renderAnswerWithImages(answerEl, text || '', imageUrls || []);
      }
      scrollToBottom();
    }

    function addBotMsgSkeleton(){
      const id = 'bot-' + Math.random().toString(36).slice(2);
      const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">BOSS智库</div>
          <div style="min-width: 180px;">
            <div class="bubble">
              <span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
              <details class="progress" open>
                <summary>阶段进度（等待中）</summary>
                <ul></ul>
              </details>
            </div>
            <div class="meta">${nowTime()}</div>
          </div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
      return document.getElementById(id);
    }

    function renderProgress(botMsgEl, doneList, runningList, status){
      const details = botMsgEl.querySelector('details.progress');
      const summary = details.querySelector('summary');
      const ul = details.querySelector('ul');
      const done = Array.isArray(doneList) ? doneList : [];
      const running = Array.isArray(runningList) ? runningList : [];
      const totalDone = done.length;
      const totalRun = running.length;

      const statusMap = {
        'processing': '处理中',
        'completed': '已完成',
        'failed': '失败',
        'pending': '等待中',
      };
      const displayStatus = statusMap[status] || status || 'unknown';

      summary.textContent = `阶段进度（已完成${totalDone}，进行中${totalRun}，状态：${displayStatus}）`;

      const lines = [
        ...done.map(x => `✓ ${x}`),
        ...running.map(x => `… ${x}`)
      ];
      ul.innerHTML = '';
      if(lines.length === 0){
        ul.insertAdjacentHTML('beforeend', '<li>暂无进度</li>');
      }else{
        for(const line of lines){
          ul.insertAdjacentHTML('beforeend', `<li>${escapeHtml(line)}</li>`);
        }
      }
    }

    function finalizeBotAnswer(botMsgEl, answer, error, imageUrls){
      const bubble = botMsgEl.querySelector('.bubble');
      const progress = botMsgEl.querySelector('details.progress');
      const err = (error || '').trim();

      if(err){
        const progressEl = progress ? progress : null;
        if(progressEl) {
            progressEl.remove();
            progressEl.removeAttribute('open');
        }
        bubble.textContent = '';
        const errEl = document.createElement('div');
        errEl.className = 'answer';
        errEl.textContent = `抱歉，本次处理失败：\n${err}`;
        bubble.appendChild(errEl);
        if(progressEl) bubble.appendChild(progressEl);
        return;
      }

      const progressEl = progress ? progress : null;
      if(progressEl) {
        progressEl.remove();
        progressEl.removeAttribute('open'); // 完成后自动收起
      }
      bubble.textContent = '';
      const answerEl = document.createElement('div');
      answerEl.className = 'answer';
      bubble.appendChild(answerEl);
      renderAnswerWithImages(answerEl, answer || '', imageUrls || []);
      if(progressEl) bubble.appendChild(progressEl);
    }

    async function apiHealth(){
      try{
        const res = await fetch(`${API_BASE}/health`);
        if(!res.ok) throw new Error('health not ok');
        apiPill.textContent = `API: 已连接`;
      }catch(e){
        apiPill.textContent = `API: 未连接`;
      }
    }

    async function loadHistory(){
      try{
        const res = await fetch(`${API_BASE}/history/${sessionId}`);
        if(!res.ok) return;
        const data = await res.json();
        const items = Array.isArray(data.items) ? data.items : [];
        if(items.length === 0) return;
        // 保留首条欢迎消息，其余先清空再渲染历史
        const nodes = Array.from(chatEl.querySelectorAll('.msg'));
        for(let i=1;i<nodes.length;i++) nodes[i].remove();
        for(const item of items){
          if(item.role === 'user'){
            addUserMsgWithTime(item.text || '', item.ts);
          }else{
            addBotMsgWithTime(item.text || '', item.ts, item.image_urls || []);
          }
        }
        scrollToBottom();
      }catch(_){}
    }

    async function submitQuery(text){
      const isStream = streamToggle.checked;
      const res = await fetch(`${API_BASE}/query`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          query: text,
          session_id: sessionId,
          is_stream: isStream
        })
      });
      if(!res.ok){
        const msg = await res.text();
        throw new Error(msg || '请求失败');
      }
      return await res.json();
    }

    async function poll(taskId, botMsgEl){
      const typing = botMsgEl.querySelector('.typing');
      const interval = setInterval(async () => {
        try{
          const res = await fetch(`${API_BASE}/status/${taskId}`);
          const data = await res.json();
          renderProgress(botMsgEl, data.done_list, data.running_list, data.status);

          if(data.status === 'completed'){
            if(typing) typing.remove();
            finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
            clearInterval(interval);
            sendBtn.disabled = false;
          }else if(data.status === 'failed'){
            if(typing) typing.remove();
            finalizeBotAnswer(botMsgEl, data.answer, data.error || 'failed', data.image_urls || []);
            clearInterval(interval);
            sendBtn.disabled = false;
          }
        }catch(e){
          // 轮询错误不立刻终止，让用户稍后重试
        }
      }, 1200);
    }

    async function onSend(){
      console.log('[perf] A onSend start', performance.now());
      const text = (inputEl.value || '').trim();
      if(!text) return;
      inputEl.value = '';
      addUserMsg(text);
      const botMsgEl = addBotMsgSkeleton();
      sendBtn.disabled = true;

      try{
        const isStream = streamToggle.checked;
        console.log('[perf] B submitQuery start', performance.now(), { isStream });
        const data = await submitQuery(text);
        console.log('[perf] B submitQuery end', performance.now(), data);

        // 渲染初始状态
        renderProgress(botMsgEl, [], [], 'pending');

        if (!isStream) {
          // 非流式：直接拿到结果
          // data: { session_id, answer, done_list, error, message }
          renderProgress(botMsgEl, data.done_list || [], [], 'completed');
          finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
          sendBtn.disabled = false;
          return;
        }

        // 流式：SSE
        const { session_id } = data; // 此时 backend 返回 session_id

        const bubble = botMsgEl.querySelector('.bubble');
        let answerEl = bubble.querySelector('.answer');
        if(!answerEl){
          answerEl = document.createElement('div');
          answerEl.className = 'answer';
          bubble.insertBefore(answerEl, bubble.firstChild);
        }

        const es = new EventSource(`${API_BASE}/stream/${session_id}`);
        console.log('[perf] C EventSource created', performance.now(), { session_id });
        let rawAnswerText = '';

        es.addEventListener('progress', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            renderProgress(botMsgEl, d.done_list, d.running_list, d.status);
            // 当进度状态已完成时，提前结束“...”等待态
            if(d && d.status === 'completed'){
              const typing = botMsgEl.querySelector('.typing');
              if(typing) typing.remove();
              // 防止后端未发送 final 导致按钮一直禁用
              sendBtn.disabled = false;
            }
          }catch(_){}
        });

        es.addEventListener('delta', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            const delta = d.delta || '';
            if(delta){
              rawAnswerText += delta;
              // 即使后端未发送 final，也尽可能在流式过程中渲染图片
              renderAnswerWithImages(answerEl, rawAnswerText, []);
              scrollToBottom();
            }
          }catch(_){}
        });

        es.addEventListener('final', (e) => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          // 收起进度条
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');

          try{
            const d = JSON.parse(e.data || '{}');
            // 流式 delta 可能不包含“【图片】/图片列表”，最终包的 d.answer 才是完整答案；优先使用 d.answer
            const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0) ? d.answer : (rawAnswerText || answerEl.textContent || '');
            renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
          }catch(_){}
          es.close();
          sendBtn.disabled = false;
        });

        es.addEventListener('final_answer', (e) => {
           // 响应用户的 final_answer 信号，确保图片渲染
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');

          try{
            const d = JSON.parse(e.data || '{}');
            const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0) ? d.answer : (rawAnswerText || answerEl.textContent || '');
            renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
          }catch(_){}
          es.close();
          sendBtn.disabled = false;
        });

        es.addEventListener('error', (e) => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          // 收起进度条
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');

          try{
            const msg = e && e.data ? (JSON.parse(e.data).error || 'SSE 连接中断/失败') : 'SSE 连接中断/失败';
            rawAnswerText += `\n\n（错误：${msg}）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }catch(_){
            rawAnswerText += `\n\n（错误：SSE 连接中断/失败）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }
          es.close();
          sendBtn.disabled = false;
        });
      }catch(e){
        const bubble = botMsgEl.querySelector('.bubble');
        const progress = botMsgEl.querySelector('details.progress');
        const typing = botMsgEl.querySelector('.typing');
        if(typing) typing.remove();
        bubble.innerHTML = `请求失败：${escapeHtml(e.message || e)}\n\n` + progress.outerHTML;
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', onSend);
    inputEl.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        onSend();
      }
    });
    btnClear.addEventListener('click', async () => {
      if(!confirm('确定要清空当前会话的历史记录吗？这将无法恢复。')) return;

      try {
        const res = await fetch(`${API_BASE}/history/${sessionId}`, { method: 'DELETE' });
        if(!res.ok) {
           console.error("Failed to clear history backend, status:", res.status);
           alert('服务端清空失败，仅清空本地显示');
        }
      } catch(e) {
        console.error("Failed to clear history backend", e);
        alert('服务端清空失败，仅清空本地显示');
      }

      // 清空除首条欢迎消息外的内容
      const nodes = Array.from(chatEl.querySelectorAll('.msg'));
      for(let i=1;i<nodes.length;i++) nodes[i].remove();
      scrollToBottom();
    });

    apiHealth();
    setInterval(apiHealth, 5000);
    loadHistory();
    setTimeout(() => inputEl.focus(), 200);
  </script>
</body>
</html>
