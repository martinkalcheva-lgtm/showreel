<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" class="js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>知识库文件导入</title>
  <link rel="stylesheet" href="design-system.css">
  <style>
    /* ====================================================================
       页面级布局规则（kb-import 落地）
       硬约束：只消费 design-system.css 的 token 与组件类。
       本文件不新增任何颜色 / 圆角 / 阴影 / 字体族，只做栅格与流式布局。
       .file-item / .file-info / .file-name / .file-size / .progress-bar* /
       .status-badge* / .log-* 是页面脚本逐字保留的旧模板类名
       （上传 / 轮询逻辑一行不改），这里用 token 把它们桥接到设计系统外观。
       ==================================================================== */
    .app-top nav a { min-height: 44px; display: inline-flex; align-items: center; }
    .app-top .top-actions { display: flex; align-items: center; gap: var(--sp-2); }

    .panel-head h2 { font-size: var(--fs-h3); }
    .empty h3 { font-size: var(--fs-h3); margin-bottom: .375rem; }

    .stack { display: flex; flex-direction: column; gap: var(--sp-6); }
    .stack-2 { display: flex; flex-direction: column; gap: var(--sp-2); }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3); }

    /* 页头 */
    .page-hd { display: flex; flex-direction: column; gap: var(--sp-3); }
    .page-hd .t-lead { max-width: 52em; }
    .page-hd .eyebrow { text-wrap: balance; }

    /* 拖拽上传区：复用 .empty 的虚线框语义 */
    .drop { display: flex; flex-direction: column; align-items: center; gap: var(--sp-3); text-align: center; }
    .drop-mark { font-size: 2.25rem; color: var(--muted); line-height: 1; }
    .drop .t-meta { max-width: 44em; }
    .file-input { display: none; }

    /* 文件清单（脚本模板类名桥接） */
    #fileList { display: flex; flex-direction: column; gap: var(--sp-2); }
    #fileList:empty::before {
      content: "还没有文件 — 上传后每个文件会在这里显示状态与解析日志";
      font-size: var(--fs-mini); color: var(--muted); line-height: 1.75;
    }
    .file-item {
      display: flex; justify-content: space-between; align-items: center; gap: var(--sp-3);
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface);
      padding: var(--sp-3) var(--sp-4);
    }
    .file-info { display: flex; flex-direction: column; flex: 1; min-width: 0; margin-right: var(--sp-3); }
    .file-name { font-weight: 600; color: var(--fg); overflow-wrap: anywhere; }
    .file-size {
      font-family: var(--font-mono); font-size: var(--fs-mini);
      color: var(--muted); margin-top: .25rem;
    }
    .status-badge {
      padding: .2em .55em;
      border: 1px solid var(--border); border-radius: var(--radius);
      font-family: var(--font-mono); font-size: var(--fs-mini); font-weight: 600;
      color: var(--muted); background: var(--surface-subtle);
      white-space: nowrap;
    }
    .status-uploading { color: var(--warn); border-color: var(--border-warn); background: var(--warn-tint); }
    .status-processing { color: var(--info); border-color: var(--border-info); background: var(--info-tint); }
    .status-completed { color: var(--success); border-color: var(--border-success); background: var(--success-tint); }
    .status-error { color: var(--accent); border-color: var(--border-accent); background: var(--accent-tint); }

    /* 进度条：4px 发丝条（宽度与终态色由脚本逐字保留的旧逻辑驱动） */
    .progress-bar-container {
      width: 100%; height: 4px;
      background: var(--border); border-radius: var(--radius);
      margin-top: var(--sp-2);
      overflow: hidden; display: none;
    }
    .progress-bar {
      height: 100%; width: 0;
      background: var(--warn);
      transition: width var(--t-3) var(--ease-state);
    }

    /* 任务日志（可展开/收起） */
    .log-details { margin-top: var(--sp-2); font-size: var(--fs-mini); color: var(--muted); }
    .log-details summary { cursor: pointer; user-select: none; color: var(--muted); }
    .log-list { margin: .375rem 0 0 1.25rem; padding: 0; }
    .log-list li { margin: .125rem 0; line-height: 1.6; color: var(--fg-secondary); overflow-wrap: anywhere; }

    /* 页眉眉标/说明在窄屏的配平 */
    .t-lead { text-wrap: pretty; }

    @media (max-width: 767px) {
      .app-top .brand .sub { display: none; }
      .file-item { flex-direction: column; align-items: stretch; }
      .file-info { margin-right: 0; }
      .status-badge { align-self: flex-start; }
      .stack { gap: var(--sp-5); }
    }
  </style>
</head>
<body>

<div class="app">
  <!-- ================================================================
       应用顶栏
       ================================================================ -->
  <header class="app-top">
    <a class="brand" href="chat.html">
      <svg class="mark ic-lg" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <rect x="12" y="12" width="8" height="8" rx="2"/>
        <rect x="4" y="4" width="4" height="4" rx="1"/>
        <rect x="24" y="4" width="4" height="4" rx="1"/>
        <rect x="4" y="24" width="4" height="4" rx="1"/>
        <rect x="24" y="24" width="4" height="4" rx="1"/>
      </svg>
      <span>知识库文件导入</span>
      <span class="sub">KB AGENT · IMPORT</span>
    </a>

    <nav aria-label="页面导航">
      <a href="chat.html">知识库问答</a>
      <a href="import.html" aria-current="page">文件导入</a>
    </nav>

    <div class="top-actions">
      <button type="button" class="btn btn-sm btn-ghost" id="themeBtn" aria-label="切换明暗主题">
        <span id="themeLabel">DARK</span>
      </button>
    </div>
  </header>

  <div class="app-body">
    <!-- ============================================================
         主栏
         ============================================================ -->
    <main class="pane">
      <div class="stack">

        <!-- 页头 -->
        <header class="page-hd">
          <h1 class="t-h1">知识库文件导入</h1>
          <p class="t-lead">
            选择或拖入文件后，服务端会逐个解析并入库；每个文件的阶段日志实时展开，
            单个文件失败不影响同批其他文件。
          </p>
          <div class="row">
            <span class="tag">PDF</span>
            <span class="tag">MD</span>
            <span class="tag">MULTI-FILE</span>
          </div>
        </header>

        <!-- 上传区 -->
        <section class="panel" aria-labelledby="h-upload">
          <div class="panel-head">
            <h2 id="h-upload">上传文件</h2>
            <span class="badge">01 / 01</span>
          </div>
          <div class="panel-body">
            <div class="empty drop" id="dropZone" onclick="document.getElementById('fileInput').click()">
              <span class="drop-mark" aria-hidden="true">
                <svg class="ic" aria-hidden="true" focusable="false"><use href="#i-doc"></use></svg>
              </span>
              <h3>把文件拖到这里，或点击选择</h3>
              <p class="t-meta">
                支持 PDF / MD，可一次选择多个文件。上传后服务端逐个处理，
                状态与日志会显示在下方「文件队列」。
              </p>
              <div class="row">
                <button type="button" class="btn btn-primary">
                  <svg class="ic ic-sm" aria-hidden="true" focusable="false"><use href="#i-doc"></use></svg>
                  <span>选择文件</span>
                </button>
              </div>
              <div class="tag-row">
                <span class="tag">PDF</span>
                <span class="tag">MD</span>
                <span class="tag">DRAG &amp; DROP</span>
              </div>
              <input type="file" id="fileInput" class="file-input" multiple accept=".pdf,.md">
            </div>
          </div>
        </section>

        <!-- 文件队列 -->
        <section class="panel" aria-labelledby="h-queue">
          <div class="panel-head">
            <h2 id="h-queue">文件队列</h2>
            <span class="badge mono">UPLOAD QUEUE</span>
          </div>
          <div class="panel-body">
            <div id="fileList"></div>
          </div>
        </section>

      </div>
    </main>
  </div>
</div>

<script src="icons.js"></script>
<script>
  (function () {
    function sync() {
      var el = document.getElementById('themeLabel');
      if (!el) return;
      el.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? 'LIGHT' : 'DARK';
    }
    document.addEventListener('click', function (e) {
      if (e.target && e.target.closest && e.target.closest('#themeBtn')) setTimeout(sync, 0);
    });
    sync();
  })();
</script>
<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    
    // 模拟后端API地址
    const API_BASE = 'http://127.0.0.1:8000';

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.backgroundColor = '#ecf6fd';
    });

    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.style.backgroundColor = '';
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.backgroundColor = '';
        handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
        handleFiles(e.target.files);
    });

    function handleFiles(files) {
        Array.from(files).forEach(uploadFile);
    }

    function updateProgressBar(bar, percentage) {
        bar.style.width = percentage + '%';
        if (percentage >= 100) {
            bar.style.backgroundColor = '#3498db'; // 蓝色
        } else {
            bar.style.backgroundColor = '#f39c12'; // 橘红色
        }
    }

    async function uploadFile(file) {
        // 创建文件项UI
        const id = 'file-' + Math.random().toString(36).substr(2, 9);
        const html = `
            <div class="file-item" id="${id}">
                <div class="file-info">
                    <span class="file-name">${file.name}</span>
                    <span class="file-size">${(file.size / 1024).toFixed(2)} KB</span>
                    <div class="progress-bar-container">
                        <div class="progress-bar"></div>
                    </div>
                    <details class="log-details">
                        <summary>日志（点击展开）</summary>
                        <ul class="log-list"></ul>
                    </details>
                </div>
                <div class="status-badge status-uploading">上传中...</div>
            </div>
        `;
        fileList.insertAdjacentHTML('afterbegin', html);
        const itemEl = document.getElementById(id);
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressBar = itemEl.querySelector('.progress-bar');
        const progressContainer = itemEl.querySelector('.progress-bar-container');
        const logDetails = itemEl.querySelector('.log-details');
        const logSummary = itemEl.querySelector('.log-details summary');
        const logListEl = itemEl.querySelector('.log-list');

        // 构建FormData
        const formData = new FormData();
        formData.append('files', file);

        try {
            // 1. 上传文件
            progressContainer.style.display = 'block';
            // 模拟上传进度
            updateProgressBar(progressBar, 50);

            const response = await fetch(`${API_BASE}/upload`, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error('Upload failed');
            
            const result = await response.json();
            const taskId = result.task_ids[0]; // 假设一次传一个或取第一个

            // 上传完成，进入处理中，进度固定为30%
            updateProgressBar(progressBar, 30);
            statusBadge.textContent = '处理中...';
            statusBadge.className = 'status-badge status-processing';

            // 2. 轮询状态
            pollStatus(taskId, itemEl);

        } catch (error) {
            console.error(error);
            statusBadge.textContent = '失败';
            statusBadge.className = 'status-badge status-error';
        }
    }

    function normalizeDoneLog(text) {
        // 后端可能返回中文节点名，也可能已拼接“已完成”
        if (typeof text !== 'string') return String(text);
        return text.endsWith('已完成') ? text : `${text}已完成`;
    }

    function normalizeRunningLog(text) {
        // 后端可能返回中文节点名，也可能已拼接“正在进行.../处理中...”
        if (typeof text !== 'string') return String(text);
        if (text.startsWith('正在进行')) return text.endsWith('...') ? text : `${text}...`;
        return `正在进行${text}...`;
    }

    function renderLogs(itemEl, doneList, runningList) {
        const logSummary = itemEl.querySelector('.log-details summary');
        const logListEl = itemEl.querySelector('.log-list');
        const logDetails = itemEl.querySelector('.log-details');

        const done = Array.isArray(doneList) ? doneList : [];
        const running = Array.isArray(runningList) ? runningList : [];

        // 更新 summary（即使收起也能看到进度）
        logSummary.textContent = `日志（已完成${done.length}，进行中${running.length}，点击展开）`;

        // 清空并重建列表
        logListEl.innerHTML = '';
        const lines = [
            ...done.map(normalizeDoneLog),
            ...running.map(normalizeRunningLog),
        ];

        if (lines.length === 0) {
            const li = document.createElement('li');
            li.textContent = '暂无日志';
            logListEl.appendChild(li);
        } else {
            for (const line of lines) {
                const li = document.createElement('li');
                li.textContent = line;
                logListEl.appendChild(li);
            }
        }

        // 如果没有任何日志，默认收起；否则保持用户选择
        if (lines.length === 0) {
            logDetails.open = false;
        }
    }

    function pollStatus(taskId, itemEl) {
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressBar = itemEl.querySelector('.progress-bar');
        
        const interval = setInterval(async () => {
            try {
                const res = await fetch(`${API_BASE}/status/${taskId}`);
                const data = await res.json();

                // 渲染日志（done/running）
                renderLogs(itemEl, data.done_list, data.running_list);
                
                if (data.status === 'completed') {
                    statusBadge.textContent = '已完成';
                    statusBadge.className = 'status-badge status-completed';
                    updateProgressBar(progressBar, 100);
                    clearInterval(interval);
                } else if (data.status === 'processing') {
                    // 保持处理中状态
                    statusBadge.textContent = '处理中...';
                    // 确保进度为30%
                     updateProgressBar(progressBar, 30);
                } else if (data.status === 'failed') {
                    statusBadge.textContent = '失败';
                    statusBadge.className = 'status-badge status-error';
                    clearInterval(interval);
                }
            } catch (e) {
                console.error('Polling error', e);
            }
        }, 2000); // 每2秒轮询一次
    }
</script>

</body>
</html>
