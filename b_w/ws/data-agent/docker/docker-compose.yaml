# Boss 问数（data-agent）专用 MySQL
# ⚠️ 本文件只管这一件事。ES / Kibana / Qdrant / Embedding 的容器是由
#    C:\Users\gbb\Desktop\stady_all\xm\ws\data-agent\docker\docker-compose.yaml 创建的，
#    一键脚本里用 docker start 按容器名起，所以本文件里那几个服务已注释掉（避免同名抢容器）。
# 2026-10-16：加项目名 boss-agent + 独立数据卷，彻底断开与客服库的重名冲突。
name: boss-agent
services:

  mysql:
    image: mysql:8.0
    container_name: boss-data-agent-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: itwwy123
      MYSQL_USER: itwwy
      MYSQL_PASSWORD: itwwy123
    ports:
      - "3309:3306"   # 3306 被系统 MySQL80 占用（2026-10-16 挪到 3309）
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci

