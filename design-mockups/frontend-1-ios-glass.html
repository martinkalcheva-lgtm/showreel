<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>作品集 · 淡色玻璃拟态</title>
<style>
/* ============================================================
   iOS 26 淡色玻璃拟态 · 前端实现者 1 号
   - 8pt 网格 / 20px 卡片圆角 / 999px 药丸按钮 / 14px 图标
   - Aurora 渐变背景 + 漂浮光斑（毛玻璃 blur(20px) saturate(180%)）
   - 浅色 / 深色模式切换（CSS 变量 + prefers-color-scheme）
   ============================================================ */

:root {
  /* —— 8pt 网格 —— */
  --space-1: 8px;
  --space-2: 16px;
  --space-3: 24px;
  --space-4: 32px;
  --space-5: 40px;
  --space-6: 48px;
  --space-7: 64px;

  /* —— 圆角 —— */
  --radius-lg: 20px;
  --radius-md: 16px;
  --radius-pill: 999px;

  /* —— 颜色 · 浅色（默认） —— */
  --bg-base: #F2F2F7;                 /* iOS 系统浅色背景 */
  --text-primary: #1C1C1E;
  --text-secondary: #6E6E73;
  --text-tertiary: #AEAEB2;
  --separator: rgba(60, 60, 67, 0.12);

  /* 卡片 / 玻璃 */
  --glass-bg: rgba(255, 255, 255, 0.55);
  --glass-border: rgba(255, 255, 255, 0.65);
  --glass-shadow: 0 12px 40px rgba(80, 90, 130, 0.12);
  --glass-blur: 20px;

  /* Aurora 渐变（淡蓝紫 → 米白） */
  --aurora-1: #C9E2FF;   /* 淡蓝 */
  --aurora-2: #E6D9FF;   /* 淡紫 */
  --aurora-3: #FFF4E6;   /* 米白 */
  --blob-a: rgba(120, 160, 255, 0.55);
  --blob-b: rgba(200, 148, 255, 0.45);
  --blob-c: rgba(255, 196, 150, 0.45);

  /* 项目主题色 */
  --proj-blue: #5B8DEF;
  --proj-green: #4CD08A;
  --proj-orange: #FF9F4A;

  --nav-bg: rgba(242, 242, 247, 0.72);
  --toggle-bg: #E5E5EA;
}

/* —— 深色模式 —— */
[data-theme="dark"] {
  --bg-base: #000000;
  --text-primary: #F2F2F7;
  --text-secondary: #98989E;
  --text-tertiary: #636366;
  --separator: rgba(255, 255, 255, 0.14);

  --glass-bg: rgba(44, 44, 48, 0.5);
  --glass-border: rgba(255, 255, 255, 0.12);
  --glass-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);

  --aurora-1: #1A2440;
  --aurora-2: #2A2040;
  --aurora-3: #33291C;
  --blob-a: rgba(60, 90, 200, 0.5);
  --blob-b: rgba(120, 70, 200, 0.4);
  --blob-c: rgba(200, 120, 60, 0.3);

  --proj-blue: #7AA2FF;
  --proj-green: #62E6A0;
  --proj-orange: #FFB570;

  --nav-bg: rgba(0, 0, 0, 0.62);
  --toggle-bg: #3A3A3C;
}

/* 跟随系统（无 data-theme 属性时） */
html:not([data-theme]) {
  color-scheme: light dark;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
    "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg-base);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.4s ease, color 0.4s ease;
  overflow-x: hidden;
}

/* ============ Aurora 背景 ============ */
.aurora {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(120% 120% at 15% 0%, var(--aurora-1) 0%, transparent 55%),
    radial-gradient(120% 120% at 85% 20%, var(--aurora-2) 0%, transparent 55%),
    radial-gradient(120% 120% at 50% 110%, var(--aurora-3) 0%, transparent 55%);
  transition: background 0.6s ease;
  overflow: hidden;
}

/* 漂浮光斑 */
.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(70px);
  pointer-events: none;
  will-change: transform;
}
.blob-a {
  width: 340px; height: 340px;
  background: var(--blob-a);
  top: -60px; left: 8%;
  animation: float-a 16s ease-in-out infinite;
}
.blob-b {
  width: 280px; height: 280px;
  background: var(--blob-b);
  top: 30%; right: -40px;
  animation: float-b 20s ease-in-out infinite;
}
.blob-c {
  width: 300px; height: 300px;
  background: var(--blob-c);
  bottom: -80px; left: 30%;
  animation: float-c 18s ease-in-out infinite;
}

@keyframes float-a {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(40px, 30px) scale(1.1); }
}
@keyframes float-b {
  0%, 100% { transform: translate(0, 0) scale(1.05); }
  50%      { transform: translate(-30px, -40px) scale(0.95); }
}
@keyframes float-c {
  0%, 100% { transform: translate(0, 0) scale(0.95); }
  50%      { transform: translate(25px, -25px) scale(1.08); }
}

/* ============ 导航栏 (sticky 毛玻璃) ============ */
.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--nav-bg);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 0.5px solid var(--separator);
  transition: background 0.4s ease;
}
.nav-inner {
  max-width: 1080px;
  margin: 0 auto;
  padding: calc(var(--space-2) + env(safe-area-inset-top)) var(--space-4);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.2px;
}
.brand .logo {
  width: 32px; height: 32px;
  border-radius: 10px;
  background: linear-gradient(135deg, #6FA3FF, #C89BFF);
  display: grid;
  place-items: center;
  color: #fff;
  box-shadow: 0 4px 12px rgba(120, 150, 255, 0.35);
}
.brand .logo svg { width: 18px; height: 18px; }

.nav-actions {
  display: flex;
  align-items: center;
  gap: var(--space-1);
}

/* 主题切换 · iOS 开关 */
.theme-switch {
  display: flex;
  align-items: center;
  background: var(--toggle-bg);
  border-radius: var(--radius-pill);
  padding: 3px;
  width: 56px;
  height: 32px;
  cursor: pointer;
  position: relative;
  transition: background 0.3s ease;
}
.theme-switch .knob {
  position: absolute;
  top: 3px; left: 3px;
  width: 26px; height: 26px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  display: grid;
  place-items: center;
  transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
}
.theme-switch .knob svg { width: 14px; height: 14px; color: #FFB800; }
[data-theme="dark"] .theme-switch .knob {
  transform: translateX(24px);
}
[data-theme="dark"] .theme-switch .knob svg { color: #8E8E93; }

/* ============ 主内容 ============ */
main {
  position: relative;
  z-index: 1;
  max-width: 1080px;
  margin: 0 auto;
  padding: var(--space-7) var(--space-4) var(--space-7);
}

/* 页头 */
.hero {
  text-align: center;
  margin-bottom: var(--space-6);
}
.hero .eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  background: var(--glass-bg);
  border: 0.5px solid var(--glass-border);
  padding: 6px 14px;
  border-radius: var(--radius-pill);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  margin-bottom: var(--space-3);
}
.hero h1 {
  font-size: clamp(34px, 6vw, 54px);
  font-weight: 800;
  letter-spacing: -1px;
  line-height: 1.1;
  margin-bottom: var(--space-2);
  background: linear-gradient(120deg, var(--text-primary) 30%, var(--text-secondary));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero p {
  font-size: 17px;
  color: var(--text-secondary);
  max-width: 560px;
  margin: 0 auto;
}

/* ============ 项目卡片网格 ============ */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-4);
}

.card {
  position: relative;
  border-radius: var(--radius-lg);
  padding: var(--space-4);
  background: var(--glass-bg);
  border: 0.5px solid var(--glass-border);
  backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  box-shadow: var(--glass-shadow);
  overflow: hidden;
  cursor: pointer;
  opacity: 0;
  transform: translateY(24px);
  animation: card-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  transition:
    transform 0.35s cubic-bezier(0.2, 0.8, 0.4, 1),
    box-shadow 0.35s ease;
}
.card:nth-child(1) { animation-delay: 0.05s; }
.card:nth-child(2) { animation-delay: 0.16s; }
.card:nth-child(3) { animation-delay: 0.27s; }

@keyframes card-in {
  to { opacity: 1; transform: translateY(0); }
}

/* 卡片顶部高光边缘（GlassKit 风格） */
.card::before {
  content: "";
  position: absolute;
  top: 0; left: 8%; right: 8%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.85), transparent);
  opacity: 0.8;
  pointer-events: none;
}
[data-theme="dark"] .card::before {
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  opacity: 0.35;
}

/* hover 弹性缩放 */
.card:hover {
  transform: translateY(-6px) scale(1.02);
  box-shadow: 0 24px 60px rgba(80, 90, 130, 0.18);
}

/* 图标 */
.card-icon {
  width: 56px; height: 56px;
  border-radius: var(--radius-md);
  display: grid;
  place-items: center;
  margin-bottom: var(--space-3);
  color: #fff;
  position: relative;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.4);
}
.card-icon svg {
  width: 28px; height: 28px;
  stroke-width: 2;
}

/* hover 图标旋转 */
.card:hover .card-icon {
  transform: rotate(-6deg) scale(1.08);
}
.card-icon.c-blue { background: linear-gradient(135deg, #66A2FF, #3B76E0); }
.card-icon.c-green { background: linear-gradient(135deg, #5CE095, #22B573); }
.card-icon.c-orange { background: linear-gradient(135deg, #FFB25F, #FF8A3D); }

.card h2 {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: var(--space-1);
  letter-spacing: -0.3px;
}
.card .desc {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: var(--space-3);
  line-height: 1.6;
}

/* 标签 */
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: var(--space-3);
}
.tag {
  font-size: 12px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  background: rgba(0, 0, 0, 0.04);
  border: 0.5px solid transparent;
  color: var(--text-secondary);
}
[data-theme="dark"] .tag { background: rgba(255,255,255,0.07); }

/* 底部条 */
.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: var(--space-2);
  border-top: 0.5px solid var(--separator);
}
.card-footer .meta {
  font-size: 12px;
  color: var(--text-tertiary);
}
.card-arrow {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--toggle-bg);
  display: grid;
  place-items: center;
  transition: background 0.3s ease, transform 0.3s ease;
}
.card-arrow svg { width: 14px; height: 14px; stroke: var(--text-secondary); stroke-width: 2.5; }
.card:hover .card-arrow {
  background: var(--proj-blue);
  transform: translateX(-2px);
}
.card:hover .card-arrow svg { stroke: #fff; }

/* 主题色强调（底部进度条） */
.card::after {
  content: "";
  position: absolute;
  bottom: 0; left: var(--space-4); right: var(--space-4);
  height: 3px;
  border-radius: 3px 3px 0 0;
  background: var(--proj-blue);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
}
.card:nth-child(1)::after { background: var(--proj-blue); }
.card:nth-child(2)::after { background: var(--proj-green); }
.card:nth-child(3)::after { background: var(--proj-orange); }
.card:hover::after { transform: scaleX(1); }

/* ============ 页脚 ============ */
footer {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: var(--space-6) var(--space-4);
  color: var(--text-tertiary);
  font-size: 13px;
}

/* ============ 响应式 ============ */
@media (max-width: 900px) {
  .grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 560px) {
  main { padding: var(--space-5) var(--space-2) var(--space-5); }
  .grid { grid-template-columns: 1fr; gap: var(--space-3); }
  .nav-inner { padding: var(--space-2) var(--space-2); }
  .brand { font-size: 16px; }
  .hero { margin-bottom: var(--space-5); }
  .card { padding: var(--space-3); }
}

/* 打印移除动画 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<!-- Aurora 背景 -->
<div class="aurora" aria-hidden="true">
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>
  <div class="blob blob-c"></div>
</div>

<!-- 导航栏 -->
<nav class="nav">
  <div class="nav-inner">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 4.8L19 8l-3.6 3.6L16.6 16 12 13.8 7.4 16l1.2-4.4L5 8l4.6-1.2z"/><circle cx="19" cy="19" r="2"/></svg>
      </div>
      <span>作品集</span>
    </div>
    <div class="nav-actions">
      <div class="theme-switch" role="button" aria-label="切换浅色/深色模式" onclick="toggleTheme()">
        <div class="knob" id="themeKnob">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </div>
      </div>
    </div>
  </div>
</nav>

<!-- 主内容 -->
<main>
  <header class="hero">
    <div class="eyebrow">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      作品选集
    </div>
    <h1>我打造的<br>数字化产品</h1>
    <p>一份关于问题求解、用户洞察与工程优雅的实践记录。</p>
  </header>

  <!-- 项目卡片 -->
  <section class="grid">

    <!-- 卡片 1 · 问数与智库（蓝） -->
    <div class="card">
      <div class="card-icon c-blue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
      </div>
      <h2>问数与智库</h2>
      <p class="desc">数据洞察问答平台，基于企业知识库的智能分析与报表生成。</p>
      <div class="tags">
        <span class="tag">数据分析</span>
        <span class="tag">AI 问答</span>
        <span class="tag">知识库</span>
      </div>
      <div class="card-footer">
        <span class="meta">数据分析 · 2025</span>
        <div class="card-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </div>
      </div>
    </div>

    <!-- 卡片 2 · 电商运营助手（绿） -->
    <div class="card">
      <div class="card-icon c-green">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
      </div>
      <h2>电商运营助手</h2>
      <p class="desc">面向电商运营的一站式工作台，覆盖选品、营销与订单管理。</p>
      <div class="tags">
        <span class="tag">电商</span>
        <span class="tag">运营后台</span>
        <span class="tag">数据看板</span>
      </div>
      <div class="card-footer">
        <span class="meta">电商 · 2025</span>
        <div class="card-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </div>
      </div>
    </div>

    <!-- 卡片 3 · 智能客服系统（橙） -->
    <div class="card">
      <div class="card-icon c-orange">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/><path d="M8 9h8M8 13h5"/></svg>
      </div>
      <h2>智能客服系统</h2>
      <p class="desc">多轮对话机器人与人机协同工单系统，显著提升服务效率。</p>
      <div class="tags">
        <span class="tag">大模型</span>
        <span class="tag">对话机器人</span>
        <span class="tag">工单系统</span>
      </div>
      <div class="card-footer">
        <span class="meta">客服 · 2024</span>
        <div class="card-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </div>
      </div>
    </div>

  </section>
</main>

<footer>© 2026 · 前段作品集 · 淡色玻璃拟态</footer>

<script>
function toggleTheme() {
  const cur  = document.documentElement.getAttribute('data-theme');
  if (cur === 'dark') {
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
}

/* 初始化：尊重系统偏好 */
(function initTheme() {
  if (matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>

</body>
</html>
